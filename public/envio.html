<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Envío - Sportify Store</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <div class="container">
            <h1><a href="/" class="logo">Sportify Store</a></h1>
            <nav><!-- Se llena dinámicamente --></nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <h2>Detalles de Envío</h2>
                <p>Por favor, completa tus datos para la entrega.</p>

                <form id="checkout-form">
                    <div class="form-group">
                        <label for="direccion">Dirección Completa</label>
                        <input type="text" id="direccion" name="direccion"
                            placeholder="Ej: Calle 10 # 20-30, Apto 501, Bogotá" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono de Contacto</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
                    </div>

                    <div class="form-group">
                        <label for="notas">Notas Adicionales (Opcional)</label>
                        <textarea id="notas" name="notas" rows="3"
                            placeholder="Ej: Entregar en portería, dejar con..."></textarea>
                    </div>

                    <div class="cart-summary-box" style="margin-top: 2rem; background: #2a2a2a;">
                        <h3>Resumen de tu Pedido</h3>
                        <p>Total: <strong id="checkout-total">$0.00</strong></p>
                        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Pagar y
                            Finalizar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="toast-message"></div>

    <script type="module" src="/js/envio.js"></script>
</body>

</html>
