<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Contraseña - Sportify Store</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="auth-page">
    <h1><a href="/" class="logo">Sportify Store</a></h1>
    <div class="card" style="max-width: 500px;">
        <h2>Actualizar Contraseña</h2>
        <p>Ingresa tu nueva contraseña.</p>
        <form id="update-password-form">
            <div class="form-group">
                <label for="password">Nueva Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Actualizar Contraseña</button>
        </form>
    </div>
    <div id="toast-message"></div>
    <script type="module" src="/js/auth.js"></script>
</body>

</html>
