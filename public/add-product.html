<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir/Editar Producto - Admin</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/admin.html" class="logo">Panel de Admin</a></h1>
            <nav></nav>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="card" style="max-width: 800px; margin: 2rem auto;">
                <h2>Añadir Nuevo Producto</h2>
                <form id="add-product-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nombre">Nombre del Producto</label>
                            <input type="text" name="nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="precio">Precio</label>
                            <input type="number" name="precio" required>
                        </div>
                        <div class="form-group">
                            <label for="id_categoria">Categoría (para filtrar tallas)</label>
                            <select name="id_categoria" required></select>
                        </div>
                        <div class="form-group">
                            <label for="id_marca">Marca</label>
                            <select name="id_marca"></select>
                        </div>
                    </div>
                    
                    <div class="variations-section" style="background: #2a2a2a; margin: 1.5rem 0; padding: 1.5rem; border-radius: 8px; border: 1px solid #444;">
                        <h4 style="margin-top: 0; margin-bottom: 1rem; border-bottom: 1px solid #444; padding-bottom: 0.5rem;">Gestionar Variaciones</h4>
                        
                        <!-- Tabla de variaciones existentes -->
                        <div class="table-container" style="margin-bottom: 1rem;">
                            <table class="admin-table" id="variations-table">
                                <thead>
                                    <tr>
                                        <th>Talla</th>
                                        <th>Stock</th>
                                        <th style="width: 50px;">Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="variations-list">
                                    <!-- Las filas se inyectan aquí -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Controles compactos para añadir -->
                        <div style="display: flex; gap: 1rem; align-items: flex-end; background: #222; padding: 1rem; border-radius: 6px;">
                            <div style="flex: 1;">
                                <label style="font-size: 0.85rem; margin-bottom: 0.3rem; display: block;">Talla</label>
                                <select id="variation-size-select" style="width: 100%; padding: 0.5rem;"><option>Selecciona categoría...</option></select>
                            </div>
                            <div style="width: 100px;">
                                <label style="font-size: 0.85rem; margin-bottom: 0.3rem; display: block;">Stock</label>
                                <input type="number" id="variation-stock-input" placeholder="0" style="width: 100%; padding: 0.5rem;">
                            </div>
                            <button type="button" id="add-variation-btn" class="btn btn-secondary" style="padding: 0.5rem 1rem;">+ Añadir</button>
                        </div>
                    </div>

                    <div class="form-group"><label for="imagen_url">URL de la Imagen</label><input type="url" name="imagen_url" required></div>
                    <div class="form-group"><label for="descripcion">Descripción</label><textarea name="descripcion" rows="3"></textarea></div>
                    <button type="submit" class="btn btn-primary">Añadir Producto</button>
                </form>
            </div>
        </div>
    </main>
    <div id="toast-message"></div>
    <script type="module" src="/js/add-product.js"></script>
</body>
</html>
