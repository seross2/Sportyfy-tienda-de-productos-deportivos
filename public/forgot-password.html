<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SportifyStore</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="auth-page">
    <h1><a href="/" class="logo">Sportify Store</a></h1>

    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <form id="forgot-password-form">
            <h2>Recuperar Contraseña</h2>
            <p>Ingresa tu correo y te enviaremos un enlace de recuperación.</p>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar Enlace</button>

            <p class="form-link" style="margin-top: 1rem;">¿Ya recuerdas tu contraseña? <a href="/login.html">Volver a
                    Login</a>.</p>
        </form>

        <!-- Formulario oculto para actualizar la contraseña -->
        <form id="verify-pin-form" class="hidden">
            <h2>Verificar Código</h2>
            <p>Ingresa el código que recibiste en tu correo y tu nueva contraseña.</p>
            <input type="hidden" name="email" id="recovery-email">
            <div class="form-group">
                <label for="pin">Código de Verificación</label>
                <input type="text" id="pin" name="pin" required>
            </div>
            <div class="form-group">
                <label for="password">Nueva Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Verificar y Cambiar Contraseña</button>
        </form>
    </div>

    <div id="toast-message"></div>
    <script type="module" src="/js/auth.js" defer></script>
</body>

</html>
